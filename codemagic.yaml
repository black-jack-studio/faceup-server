workflows:
  ios-testflight:
    name: FaceUp iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: faceup_asc_api_key
    environment:
      # No `ios_signing` block here on purpose: when present, Codemagic tries to fetch an
      # existing signing profile automatically *before* any script runs, and fails outright
      # if none exists yet — it has no equivalent of the --create flag. The explicit
      # "Fetch signing certificate and provisioning profile" script below (with --create)
      # handles first-time certificate/profile creation instead.
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.beaudoin.faceup"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    # No auto-trigger on push for now — trigger builds manually from the Codemagic dashboard
    # to avoid burning free-tier build minutes on every commit while iterating on the web app.
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Initialize keychain
        script: keychain initialize
      # Reuse the same certificate private key across builds instead of generating a new one
      # every time — a fresh key each build meant every certificate it created became
      # unusable the moment the build finished (the key only ever lived in that build's /tmp),
      # so the next build's attempt to create ANOTHER certificate got rejected by Apple with
      # a 409 conflict ("You already have a current iOS Distribution certificate").
      #
      # First run only: no IOS_CERTIFICATE_PRIVATE_KEY_B64 is set yet, so a new key is generated
      # and printed to this step's log as a single base64 line (multi-line PEM pasted directly
      # into Codemagic's UI kept getting corrupted — base64 has no newlines to mangle). Copy
      # that single line and add it as a **secure** Codemagic environment variable named
      # IOS_CERTIFICATE_PRIVATE_KEY_B64 so every later build reuses the exact same certificate.
      - name: Prepare certificate signing key
        script: |
          if [ -n "$IOS_CERTIFICATE_PRIVATE_KEY_B64" ]; then
            # -A forces single-line (no wrapping) base64, both for the encode below and
            # this decode, so there's never any newline for a paste into the UI to mangle.
            echo "$IOS_CERTIFICATE_PRIVATE_KEY_B64" | openssl base64 -A -d > /tmp/certificate_private_key.pem
          else
            openssl genrsa -out /tmp/certificate_private_key.pem 2048
            echo "=================================================================="
            echo "No IOS_CERTIFICATE_PRIVATE_KEY_B64 environment variable found."
            echo "Save the single-line value below as a SECURE Codemagic environment"
            echo "variable named IOS_CERTIFICATE_PRIVATE_KEY_B64 so future builds reuse"
            echo "it instead of creating (and colliding with) a new certificate every time:"
            echo "=================================================================="
            openssl base64 -A -in /tmp/certificate_private_key.pem
            echo "=================================================================="
          fi
          echo "Validating key file with openssl:"
          openssl rsa -in /tmp/certificate_private_key.pem -check -noout
      - name: Fetch or create signing certificate and provisioning profile
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/certificate_private_key.pem \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Bump build number to avoid TestFlight version conflicts
        script: |
          # Querying Apple for the latest uploaded build number was unreliable (a just-uploaded
          # build can take a while to show up, "Did not find latest build" then falls back to 0
          # and collides again). $CM_BUILD_NUMBER is Codemagic's own counter that increments on
          # every single build in this workflow, so it's always higher than the last one — no
          # dependency on Apple's processing state.
          # agvtool needs "Apple Generic Versioning" enabled in the Xcode project, which this
          # one doesn't have — set CURRENT_PROJECT_VERSION directly in the pbxproj instead.
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $CM_BUILD_NUMBER;/g" \
            "$CM_BUILD_DIR/ios/App/App.xcodeproj/project.pbxproj"
          echo "Set CURRENT_PROJECT_VERSION to $CM_BUILD_NUMBER"
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
